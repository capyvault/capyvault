server:
  port: 8081

spring:
  application:
    name: identity-service

  datasource:
    url: jdbc:h2:mem:identitydb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    open-in-view: false

    hibernate:
      ddl-auto: create-drop

    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: false

security:
  jwt:
    secret: ${JWT_SECRET:capyvault-local-development-jwt-secret-key-12345678901234567890}
    expiration: 900000