server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            # ================================
            # Identity Service
            # ================================
            - id: identity-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/auth/**,/api/v1/users/**

            # ================================
            # Project Service
            # ================================
            - id: project-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/v1/projects/**
security:
  jwt:
    secret: ${JWT_SECRET:capyvault-local-development-jwt-secret-key-12345678901234567890}

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info